plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

java {
    withJavadocJar()
    withSourcesJar()
}

// Force character encoding
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.tags = [ "apiNote", "implNote", "implSpec" ]
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'mile-shops-api'
            from components.java

            pom {
                name = 'MileShopsAPI'
                description = 'API for MileShops plugin'
                url = 'https://github.com/tutur1004/MileShops'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'milekat'
                        name = 'arthur'
                        email = 'arthur@milekat.fr'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/tutur1004/MileShops.git'
                    developerConnection = 'scm:git:ssh://github.com/tutur1004/MileShops.git'
                    url = 'https://github.com/tutur1004/MileShops'
                }
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/${githubOwner}/${repository}")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
        maven {
            name = "StagingDeploy"
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

signing {
    // Only apply signing when it's not a snapshot version
    if (!version.endsWith('SNAPSHOT')) {
        sign publishing.publications
    }
}