plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'fr.milekat'
version = '1.0.0-SNAPSHOT'

allprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
        maven { url = "https://libraries.minecraft.net/" }
        maven { url = "https://jitpack.io" }
        maven { url = "https://repo.ranull.com/maven/external/" }
    }

    dependencies {
        //  Annotation
        compileOnly group: 'org.jetbrains', name: 'annotations', version: '24.0.1'

        //  Minecraft
        compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.20.1-R0.1-SNAPSHOT'
        compileOnly group: 'com.mojang', name: 'authlib', version: '1.5.26'

        //  Utils
        compileOnly group: 'dev.sergiferry', name: 'playernpc', version: '2023.4'
    }
}

jar {
    from('src/main/java') {
        include "fr/milekat/shop/storage/adapter/sql/shop_schema.sql"
    }
    actions = [] as List<Action<? super Task>>
    dependsOn('shadowJar')
}

shadowJar {
    getArchiveClassifier().set(null)
}

dependencies {
    implementation project('api')

    //  Utils
    implementation(group: 'com.github.tutur1004', name: 'MilekatUtils', version: '976645efee') {
        exclude(group: '*')
    }
    implementation group: 'fr.mrmicky', name: 'FastInv', version: '3.0.3'
    compileOnly group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.15.2'
    compileOnly group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.15.2'
    compileOnly group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-yaml', version: '2.15.2'

    //  Storage clients
    compileOnly group: 'com.zaxxer', name: 'HikariCP', version: '4.0.3'
    compileOnly group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'
    compileOnly group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '3.1.2'
    compileOnly group: 'org.postgresql', name: 'postgresql', version: '42.5.4'
    compileOnly group: 'co.elastic.clients', name: 'elasticsearch-java', version: '8.7.1'
}