plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}

jar {
    from('src/main/java') {
        include "fr/milekat/shop/storage/adapter/sql/shop_schema.sql"
    }
    actions = [] as List<Action<? super Task>>
    dependsOn('shadowJar')
}

shadowJar{
    getArchiveClassifier().set(null)
}

repositories {
    mavenCentral()
    maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://repo.ranull.com/maven/external/" }
}

dependencies {
    //  Annotation
    compileOnly group: 'org.jetbrains', name: 'annotations', version: '23.0.0'

    //  Minecraft
    compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.19.2-R0.1-SNAPSHOT'
    compileOnly group: 'com.mojang', name: 'authlib', version: '1.5.26'

    //  Utils
    implementation group: 'com.github.tutur1004', name: 'MilekatUtils', version: '834fa1d4da'
    implementation group: 'fr.mrmicky', name: 'FastInv', version: '3.0.3'
    compileOnly group: 'dev.sergiferry', name: 'playernpc', version: '2022.8'
    compileOnly group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.14.0'
    compileOnly group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-yaml', version: '2.14.0'

    //  Storage clients
    compileOnly group: 'com.zaxxer', name: 'HikariCP', version: '4.0.3'
    compileOnly group: 'mysql', name: 'mysql-connector-java', version: '8.0.30'
    compileOnly group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '3.0.8'
    compileOnly group: 'org.postgresql', name: 'postgresql', version: '42.5.1'
    compileOnly group: 'co.elastic.clients', name: 'elasticsearch-java', version: '8.5.2'
}